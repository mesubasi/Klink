services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: klink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-klinkdb}
      POSTGRES_USER: ${DATABASE_USERNAME:-klink_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-klink_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-klink_admin} -d ${DB_NAME:-klinkdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: klink_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. RabbitMQ 3 Management (Async Analytics)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: klink_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-klink_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-klink_mq_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 4. Klink Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klink_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-klinkdb}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-klink_admin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-klink_secret_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-klink_mq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-klink_mq_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    ports:
      - "8080:8080"

  # 5. Klink Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: klink_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
