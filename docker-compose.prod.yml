services:
  # 1. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: klink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-klinkdb}
      POSTGRES_USER: ${DATABASE_USERNAME:-klink_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-klink_admin} -d ${DB_NAME:-klinkdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7
  redis:
    image: redis:7-alpine
    container_name: klink_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. RabbitMQ 3 Management
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: klink_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-klink_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 4. Klink Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klink_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-klinkdb}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-klink_admin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-klink_mq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (base64, at least 256 bits)}
      APP_DOMAIN: ${APP_DOMAIN:-https://klink.to}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://klink.to,http://localhost:3000}
      # Email (verification, password reset, invitations). Without SMTP no mail is sent.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      # Links inside emails point at the frontend
      FRONTEND_PREVIEW_URL: ${FRONTEND_PREVIEW_URL:-https://klink.to/preview/%s}
      FRONTEND_INVITE_URL: ${FRONTEND_INVITE_URL:-https://klink.to/invite/%s}
      FRONTEND_VERIFY_URL: ${FRONTEND_VERIFY_URL:-https://klink.to/verify-email/%s}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-https://klink.to/reset-password/%s}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      # First platform admin (only used while no admin exists)
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Plan limits (0 = unlimited)
      QUOTA_DEFAULT_MAX_MEMBERS: ${QUOTA_DEFAULT_MAX_MEMBERS:-0}
      QUOTA_DEFAULT_MAX_LINKS: ${QUOTA_DEFAULT_MAX_LINKS:-0}
      QUOTA_MAX_WORKSPACES_PER_USER: ${QUOTA_MAX_WORKSPACES_PER_USER:-5}
      SELF_SERVICE_WORKSPACES: ${SELF_SERVICE_WORKSPACES:-true}
    ports:
      - "8080:8080"

  # 5. Klink Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: klink_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
